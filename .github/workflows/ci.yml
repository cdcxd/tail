name: ci
on: [push, pull_request]
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.x, 1.26.x, 1.21.x, 1.18.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
      with:
          fetch-depth: 0
    - name: Test
      run: go test -race -v -timeout 2m ./...
    - name: Build lib
      run: go build
    - name: Build cmd
      run: go build
      working-directory: ./cmd/gotail
